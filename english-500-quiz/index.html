<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}</style>
<title>기초 영단어 500 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* 배치: 한 단짜리 문제지. 표제어는 사전처럼 세리프로 크게, 보기는 고딕, 번호·진행은 고정폭. 시작 → 문제 → 결과 세 화면을 차례로 보여 준다. */
:root{
  --bg:#f2f6f4; --surface:#ffffff; --ink:#15302a; --muted:#5a6f69; --line:#d5dfdb;
  --accent:#1c6b58; --accent-soft:#e0efe9; --note:#96590a;
  --ok:#1b7440; --ok-bg:#e2f2e7; --no:#b0281f; --no-bg:#fbe7e4;
  --f-word:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1917; --surface:#17231f; --ink:#e4edea; --muted:#93a8a2; --line:#2b3a36;
    --accent:#62c6aa; --accent-soft:#1d332d; --note:#e2a94f;
    --ok:#77d49c; --ok-bg:#183024; --no:#f2958b; --no-bg:#3a2220; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1917; --surface:#17231f; --ink:#e4edea; --muted:#93a8a2; --line:#2b3a36;
  --accent:#62c6aa; --accent-soft:#1d332d; --note:#e2a94f;
  --ok:#77d49c; --ok-bg:#183024; --no:#f2958b; --no-bg:#3a2220; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55; word-break:keep-all}
.wrap{max-width:640px; margin:0 auto; padding-inline:16px; padding-block:28px 56px}
button,select{font:inherit; color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.eyebrow{font-size:.8rem; color:var(--accent); font-weight:600; letter-spacing:.02em}
h1{font-size:clamp(1.7rem,6vw,2.2rem); line-height:1.2; margin:4px 0 10px; letter-spacing:-.02em; text-wrap:balance}
.lede{margin:0 0 22px; color:var(--muted)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:18px}
.field{display:flex; flex-direction:column; gap:8px}
.label{font-size:.85rem; color:var(--muted)}
.field select{width:100%; min-height:44px; padding:0 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px}
.seg{display:flex; flex-wrap:wrap; gap:8px}
.seg button{min-height:42px; padding:0 14px; background:transparent; border:1px solid var(--line); border-radius:8px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--surface); font-weight:600}
.info{margin:0; font-size:.88rem; color:var(--muted); font-variant-numeric:tabular-nums}
.primary{width:100%; min-height:52px; padding:0 18px; border:0; border-radius:10px; background:var(--ink); color:var(--bg); font-weight:700; cursor:pointer}
.primary:disabled{opacity:.35; cursor:default}
.ghost{min-height:48px; padding:0 16px; border:1px solid var(--line); border-radius:10px; background:transparent; cursor:pointer}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; font-family:var(--f-data); font-size:.82rem; color:var(--muted); font-variant-numeric:tabular-nums}
.top .quit{font-family:var(--f-body); border:0; background:none; color:var(--muted); cursor:pointer; padding:6px 0; text-decoration:underline; text-underline-offset:3px}
.track{height:4px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:24px}
.track i{display:block; height:100%; width:0; background:var(--accent); transition:width .25s}
.meta{font-size:.82rem; color:var(--muted)}
.word{font-family:var(--f-word); font-weight:600; font-size:clamp(2.1rem,9vw,3rem); line-height:1.15; margin:6px 0 12px; word-break:normal; overflow-wrap:anywhere}
.say{display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 12px; border:1px solid var(--line); border-radius:999px; background:transparent; font-size:.85rem; color:var(--muted); cursor:pointer}
.say svg{width:15px; height:15px}
.ask{font-size:.9rem; color:var(--muted); margin:22px 0 10px}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:flex; align-items:center; gap:12px; width:100%; min-height:54px; padding:12px 14px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; cursor:pointer}
.opt .num{flex:none; width:26px; height:26px; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-family:var(--f-data); font-size:.78rem; color:var(--muted)}
.opt .txt{min-width:0}
.opt:disabled{cursor:default; color:var(--ink)}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.sel .num{background:var(--accent); border-color:var(--accent); color:var(--surface)}
.opt.correct{border-color:var(--ok); background:var(--ok-bg)}
.opt.correct .num{background:var(--ok); border-color:var(--ok); color:var(--surface)}
.opt.wrong{border-color:var(--no); background:var(--no-bg)}
.opt.wrong .num{background:var(--no); border-color:var(--no); color:var(--surface)}
.opt.dim{opacity:.55}

.fb{margin-top:14px; padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:10px}
.fb.ok{border-color:var(--ok)}
.fb.no{border-color:var(--no)}
.fb .verdict{font-weight:700}
.fb.ok .verdict{color:var(--ok)}
.fb.no .verdict{color:var(--no)}
.fb .line{font-size:.95rem; margin-top:2px}
.fb .sub{font-size:.84rem; color:var(--muted); margin-top:4px}
.fb .memo{font-size:.84rem; color:var(--note); margin-top:4px}
.actions{margin-top:16px}
.keys{font-size:.78rem; color:var(--muted); text-align:center; margin:10px 0 0}
@media (hover:none){ .keys{display:none} }

.score{font-family:var(--f-data); font-weight:500; font-size:clamp(2.6rem,11vw,3.6rem); line-height:1.1; letter-spacing:-.03em; margin-top:10px; font-variant-numeric:tabular-nums}
.pct{margin:6px 0 2px; color:var(--muted)}
.btns{display:flex; flex-direction:column; gap:10px; margin:22px 0 8px}
h2{font-size:1.05rem; margin:28px 0 6px; padding-bottom:6px; border-bottom:2px solid var(--ink)}
.review{list-style:none; margin:0; padding:0}
.review li{padding:12px 0; border-bottom:1px solid var(--line)}
.r-w{font-family:var(--f-word); font-weight:600; font-size:1.15rem}
.r-pos{font-size:.75rem; color:var(--accent); margin-left:8px}
.r-ok{color:var(--ok); font-size:.92rem; margin-top:2px}
.r-no{color:var(--no); font-size:.92rem}
.r-meta{font-size:.78rem; color:var(--muted); margin-top:4px}
@media (prefers-reduced-motion: reduce){ .track i{transition:none} }
</style>
</head>
<body>
<div class="wrap">

  <section id="start">
    <div class="eyebrow">캐나다 일상생활 기준</div>
    <h1>기초 영단어 500 퀴즈</h1>
    <p class="lede">영어 단어를 보고 알맞은 한글 뜻을 다섯 개 중에서 고르는 퀴즈입니다. 기초 단어 500개가 21개 주제로 들어 있고, 보기는 같은 주제의 다른 단어 뜻에서 나옵니다.</p>

    <div class="panel">
      <div class="field">
        <label class="label" for="cat">주제</label>
        <select id="cat"><option value="all">전체 주제 (500)</option><option value="0">사람·가족 (25)</option><option value="1">몸·건강 (25)</option><option value="2">집·가구 (25)</option><option value="3">음식·식재료 (20)</option><option value="4">식당·요리 (25)</option><option value="5">옷·쇼핑 (25)</option><option value="6">돈·은행 (25)</option><option value="7">교통·이동 (25)</option><option value="8">장소·건물 (25)</option><option value="9">시간·날짜 (25)</option><option value="10">날씨·자연 (20)</option><option value="11">일·직장 (25)</option><option value="12">학교·배움 (20)</option><option value="13">전화·인터넷 (25)</option><option value="14">기본 동사 1 (25)</option><option value="15">기본 동사 2 (25)</option><option value="16">기본 동사 3 (25)</option><option value="17">형용사: 상태·성질 (25)</option><option value="18">형용사: 감정·평가 (25)</option><option value="19">수량·위치·방향 (25)</option><option value="20">자주 쓰는 부사·연결어 (15)</option></select>
      </div>
      <div class="field">
        <span class="label" id="l-count">문제 수</span>
        <div class="seg" role="group" aria-labelledby="l-count" data-key="count">
          <button type="button" id="n10" data-val="10" aria-pressed="true">10</button>
          <button type="button" id="n20" data-val="20" aria-pressed="false">20</button>
          <button type="button" id="n30" data-val="30" aria-pressed="false">30</button>
          <button type="button" id="n50" data-val="50" aria-pressed="false">50</button>
          <button type="button" id="nall" data-val="all" aria-pressed="false">전체</button>
        </div>
      </div>
      <div class="field">
        <span class="label" id="l-instant">채점 방식</span>
        <div class="seg" role="group" aria-labelledby="l-instant" data-key="instant">
          <button type="button" id="m-check" data-val="no" aria-pressed="true">고른 뒤 정답 확인 버튼</button>
          <button type="button" id="m-instant" data-val="yes" aria-pressed="false">고르면 바로 채점</button>
        </div>
      </div>
      <p class="info" id="poolInfo">선택한 범위 500단어 중 10문제를 무작위로 냅니다.</p>
      <button type="button" class="primary" id="startBtn">시작하기</button>
    </div>
  </section>

  <section id="quiz" hidden>
    <div class="top">
      <span id="qNum"></span>
      <span id="qScore"></span>
      <button type="button" class="quit" id="quitBtn">그만하기</button>
    </div>
    <div class="track" aria-hidden="true"><i id="bar"></i></div>

    <div class="meta" id="qMeta"></div>
    <p class="word" id="qWord" lang="en"></p>
    <button type="button" class="say" id="sayBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      발음 듣기
    </button>

    <p class="ask">알맞은 뜻을 고르세요.</p>
    <div class="opts" id="opts"></div>

    <div class="fb" id="fb" role="status" aria-live="polite" hidden>
      <div class="verdict" id="fbVerdict"></div>
      <div class="line" id="fbAnswer"></div>
      <div class="sub" id="fbSub"></div>
      <div class="memo" id="fbMemo"></div>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="act" disabled>정답 확인</button>
    </div>
    <p class="keys">키보드: 1~5로 고르고 Enter로 확인 · 다음</p>
  </section>

  <section id="result" hidden>
    <div class="eyebrow">결과</div>
    <div class="score" id="rScore"></div>
    <p class="pct" id="rPct"></p>
    <p id="rMsg" style="margin:0"></p>
    <div class="btns">
      <button type="button" class="primary" id="retryWrong">틀린 단어만 다시 풀기</button>
      <button type="button" class="ghost" id="retryNew">같은 설정으로 새로 풀기</button>
      <button type="button" class="ghost" id="goHome">처음으로</button>
    </div>
    <div id="rWrongWrap">
      <h2>틀린 단어</h2>
      <ul class="review" id="rList"></ul>
    </div>
  </section>

</div>

var ITEMS=RAW.map(function(r,i){ return {id:i,cat:r[0],w:r[1],pos:r[2],ko:r[3],note:r[4]||'',g:r[5]||'',p1:r[2].split('·')[0]}; });

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* 보기 5개: 정답 1 + 같은 주제의 오답 4. 품사가 같은 단어를 먼저 쓰고 모자라면 같은 주제의 나머지에서 채운다. */
function buildChoices(it){
  var seen={}; seen[it.ko]=1;
  var same=[], rest=[];
  ITEMS.forEach(function(c){
    if(c.cat!==it.cat||c.id===it.id||seen[c.ko]) return;
    if(it.g&&c.g===it.g) return;
    seen[c.ko]=1;
    (c.p1===it.p1?same:rest).push(c.ko);
  });
  var wrong=shuffle(same).slice(0,4);
  if(wrong.length<4) wrong=wrong.concat(shuffle(rest).slice(0,4-wrong.length));
  return shuffle([it.ko].concat(wrong));
}

function $(s){ return document.querySelector(s); }
var state={cat:'all',count:'10',instant:'no',queue:[],idx:0,score:0,log:[],picked:null,revealed:false,choices:[]};
var canSpeak=('speechSynthesis' in window)&&(typeof SpeechSynthesisUtterance!=='undefined');

function show(name){
  ['start','quiz','result'].forEach(function(id){ $('#'+id).hidden=(id!==name); });
  window.scrollTo(0,0);
}
function currentPool(){ return ITEMS.filter(function(it){ return state.cat==='all'||String(it.cat)===state.cat; }); }
function questionCount(pool){ return state.count==='all'?pool.length:Math.min(parseInt(state.count,10),pool.length); }
function updateInfo(){
  var pool=currentPool();
  $('#poolInfo').textContent='선택한 범위 '+pool.length+'단어 중 '+questionCount(pool)+'문제를 무작위로 냅니다.';
}
function begin(items){
  state.queue=items; state.idx=0; state.score=0; state.log=[];
  show('quiz'); showQuestion();
}
function startNew(){ var pool=currentPool(); begin(shuffle(pool).slice(0,questionCount(pool))); }

function showQuestion(){
  var it=state.queue[state.idx];
  state.picked=null; state.revealed=false; state.choices=buildChoices(it);
  $('#qNum').textContent=(state.idx+1)+' / '+state.queue.length;
  $('#qScore').textContent='정답 '+state.score;
  $('#bar').style.width=(state.idx/state.queue.length*100)+'%';
  $('#qMeta').textContent=CATS[it.cat];
  $('#qWord').textContent=it.w;
  var box=$('#opts'); box.innerHTML='';
  state.choices.forEach(function(ko,i){
    var b=document.createElement('button'); b.type='button'; b.className='opt'; b.dataset.i=i;
    var n=document.createElement('span'); n.className='num'; n.textContent=i+1;
    var t=document.createElement('span'); t.className='txt'; t.textContent=ko;
    b.appendChild(n); b.appendChild(t);
    b.addEventListener('click',function(){ pick(i); });
    box.appendChild(b);
  });
  $('#fb').hidden=true;
  var act=$('#act'); act.textContent='정답 확인'; act.disabled=true; act.hidden=(state.instant==='yes');
}
function pick(i){
  if(state.revealed||i<0||i>=state.choices.length) return;
  state.picked=i;
  [].forEach.call(document.querySelectorAll('#opts .opt'),function(b,k){ b.classList.toggle('sel',k===i); });
  $('#act').disabled=false;
  if(state.instant==='yes') reveal();
}
function reveal(){
  if(state.picked===null||state.revealed) return;
  state.revealed=true;
  var it=state.queue[state.idx], right=state.choices.indexOf(it.ko), ok=(state.picked===right);
  if(ok) state.score++;
  state.log.push({it:it,picked:state.choices[state.picked],ok:ok});
  [].forEach.call(document.querySelectorAll('#opts .opt'),function(b,k){
    b.disabled=true; b.classList.remove('sel');
    if(k===right) b.classList.add('correct'); else if(k===state.picked) b.classList.add('wrong'); else b.classList.add('dim');
  });
  var fb=$('#fb'); fb.className='fb '+(ok?'ok':'no');
  $('#fbVerdict').textContent=ok?'정답입니다':'오답입니다';
  $('#fbAnswer').textContent=it.w+' = '+it.ko;
  $('#fbSub').textContent=CATS[it.cat]+' · 품사 '+it.pos;
  $('#fbMemo').textContent=it.note; $('#fbMemo').hidden=!it.note;
  fb.hidden=false;
  $('#qScore').textContent='정답 '+state.score;
  $('#bar').style.width=((state.idx+1)/state.queue.length*100)+'%';
  var act=$('#act'); act.hidden=false; act.disabled=false;
  act.textContent=(state.idx+1>=state.queue.length)?'결과 보기':'다음 문제';
  act.focus();
}
function next(){ state.idx++; if(state.idx>=state.queue.length) showResult(); else showQuestion(); }

function showResult(){
  var n=state.log.length, s=state.score, pct=n?Math.round(s/n*100):0;
  $('#rScore').textContent=s+' / '+n;
  $('#rPct').textContent='정답률 '+pct+'%';
  $('#rMsg').textContent=pct===100?'전부 맞혔어요.':pct>=80?'틀린 단어만 한 번 더 보면 됩니다.':'틀린 단어 위주로 다시 풀어 보세요.';
  var wrong=state.log.filter(function(l){ return !l.ok; });
  $('#rWrongWrap').hidden=!wrong.length; $('#retryWrong').hidden=!wrong.length;
  var list=$('#rList'); list.innerHTML='';
  wrong.forEach(function(l){
    var li=document.createElement('li');
    var head=document.createElement('div');
    var w=document.createElement('span'); w.className='r-w'; w.lang='en'; w.textContent=l.it.w;
    var p=document.createElement('span'); p.className='r-pos'; p.textContent=l.it.pos;
    head.appendChild(w); head.appendChild(p);
    var ok=document.createElement('div'); ok.className='r-ok'; ok.textContent='정답: '+l.it.ko;
    var no=document.createElement('div'); no.className='r-no'; no.textContent='내가 고른 답: '+l.picked;
    var meta=document.createElement('div'); meta.className='r-meta'; meta.textContent=CATS[l.it.cat]+(l.it.note?' · '+l.it.note:'');
    li.appendChild(head); li.appendChild(ok); li.appendChild(no); li.appendChild(meta);
    list.appendChild(li);
  });
  show('result');
}
function speak(text){
  if(!canSpeak) return;
  try{
    var u=new SpeechSynthesisUtterance(text); u.lang='en-CA'; u.rate=0.9;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}

$('#cat').addEventListener('change',function(){ state.cat=this.value; updateInfo(); });
[].forEach.call(document.querySelectorAll('.seg'),function(seg){
  seg.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    [].forEach.call(seg.querySelectorAll('button'),function(x){ x.setAttribute('aria-pressed',x===b?'true':'false'); });
    state[seg.dataset.key]=b.dataset.val; updateInfo();
  });
});
$('#startBtn').addEventListener('click',startNew);
$('#act').addEventListener('click',function(){ if(state.revealed) next(); else reveal(); });
$('#quitBtn').addEventListener('click',function(){ if(state.log.length) showResult(); else show('start'); });
$('#retryWrong').addEventListener('click',function(){ begin(shuffle(state.log.filter(function(l){ return !l.ok; }).map(function(l){ return l.it; }))); });
$('#retryNew').addEventListener('click',startNew);
$('#goHome').addEventListener('click',function(){ show('start'); });
$('#sayBtn').addEventListener('click',function(){ var it=state.queue[state.idx]; if(it) speak(it.w); });
$('#sayBtn').hidden=!canSpeak;

document.addEventListener('keydown',function(e){
  if($('#quiz').hidden||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key>='1'&&e.key<='5'){ pick(parseInt(e.key,10)-1); return; }
  if(e.key==='Enter'){
    var a=document.activeElement, act=$('#act');
    if(a===act) return;                                  /* 버튼 자체의 클릭으로 처리 */
    if(a&&a.tagName==='BUTTON'){
      if(!a.classList.contains('opt')) return;           /* 발음 듣기·그만하기는 그대로 동작 */
      if(!state.revealed&&state.picked!==Number(a.dataset.i)) return; /* 아직 안 고른 보기면 그 보기를 선택 */
    }
    e.preventDefault();
    if(!act.hidden&&!act.disabled) act.click();
  }
});

state.cat=$('#cat').value||'all';
updateInfo();
})();
</script>
