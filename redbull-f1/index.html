<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { DecalGeometry } from 'three/addons/geometries/DecalGeometry.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { HorizontalBlurShader } from 'three/addons/shaders/HorizontalBlurShader.js';
import { VerticalBlurShader } from 'three/addons/shaders/VerticalBlurShader.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

const $ = (id) => document.getElementById(id);
const isMobile = Math.min(innerWidth, innerHeight) < 600;

// =====================================================================
// Renderer / scene / camera
// =====================================================================
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 120);
// Portrait screens get a wider lens and a longer dolly so the whole car still fits.
const lens = () => {
  const a = innerWidth / innerHeight;
  return a < 1 ? { fov: 40, k: Math.min(2.2, 1.2 / a) } : a < 1.3 ? { fov: 34, k: 1.3 } : { fov: 30, k: 1.1 };
};
const dolly = (p, t) => new THREE.Vector3(...p).sub(new THREE.Vector3(...t)).multiplyScalar(lens().k).add(new THREE.Vector3(...t));
camera.fov = lens().fov;
camera.position.copy(dolly([5.0, 1.55, 4.4], [0.15, 0.38, 0]));
// keep the car centred in the space above the control panel
function frameView() {
  const panel = document.querySelector('.panel');
  const off = panel ? Math.round(panel.getBoundingClientRect().height * 0.5) : 0;
  camera.setViewOffset(innerWidth, innerHeight, 0, off, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
}

const controls = new OrbitControls(camera, canvas);
controls.target.set(0.15, 0.38, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 1.6;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI / 2 - 0.035;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

const pmrem = new THREE.PMREMGenerator(renderer);

// =====================================================================
// Helpers
// =====================================================================
function canvasTex(w, h, draw, { srgb = true, repeat = null } = {}) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const catmull = (p0, p1, p2, p3, t) => {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
};
function sampleStations(st, f) {
  const i = Math.min(Math.floor(f), st.length - 2), t = f - i;
  const g = (k) => st[Math.max(0, Math.min(st.length - 1, k))];
  const out = {};
  for (const key in st[0]) out[key] = catmull(g(i - 1)[key], g(i)[key], g(i + 1)[key], g(i + 2)[key], t);
  return out;
}
// Super-ellipse cross-section. theta = -PI/2 is the bottom (texture seam lives there).
function sectionPoint(s, th) {
  const c = Math.cos(th), sn = Math.sin(th);
  const top = sn >= 0;
  const n = top ? s.nT : s.nB;
  const z = s.w * Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
  let y = top ? s.yM + (s.yT - s.yM) * Math.pow(sn, 2 / n)
              : s.yM - (s.yM - s.yB) * Math.pow(-sn, 2 / n);
  if (top && s.dip > 0.002) {
    const q = Math.abs(z) / s.dipW;
    if (q < 1) y -= s.dip * (1 - Math.pow(q, 5));
  }
  return [z + (s.zc || 0), y];
}

// Loft a smooth body through a list of stations. Returns { geo, startRing, endRing }.
function loft(stations, { slices = 180, segs = 144, side = 1 } = {}) {
  const pos = [], uv = [], idx = [];
  const rings = [];
  for (let i = 0; i <= slices; i++) {
    const s = sampleStations(stations, (i / slices) * (stations.length - 1));
    const ring = [];
    for (let j = 0; j <= segs; j++) {
      const v = j / segs;
      const [z, y] = sectionPoint(s, -Math.PI / 2 + v * Math.PI * 2);
      pos.push(s.x, y, z * side);
      uv.push(i / slices, v);
      ring.push(new THREE.Vector3(s.x, y, z * side));
    }
    rings.push(ring);
  }
  const W = segs + 1;
  for (let i = 0; i < slices; i++) for (let j = 0; j < segs; j++) {
    const a = i * W + j, b = a + W;
    if (side > 0) idx.push(a, a + 1, b, a + 1, b + 1, b);
    else idx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  // weld normals across the UV seam
  const n = geo.attributes.normal;
  for (let i = 0; i <= slices; i++) {
    const a = i * W, b = a + segs;
    const x = n.getX(a) + n.getX(b), y = n.getY(a) + n.getY(b), z = n.getZ(a) + n.getZ(b);
    const l = Math.hypot(x, y, z) || 1;
    n.setXYZ(a, x / l, y / l, z / l); n.setXYZ(b, x / l, y / l, z / l);
  }
  return { geo, startRing: rings[0], endRing: rings[slices] };
}
function capGeometry(ring, outward) {
  const c = new THREE.Vector3();
  ring.forEach((p) => c.add(p)); c.divideScalar(ring.length);
  const pos = [c.x, c.y, c.z];
  ring.forEach((p) => pos.push(p.x, p.y, p.z));
  const idx = [];
  for (let j = 1; j < ring.length; j++) idx.push(0, j, j + 1 > ring.length ? 1 : j + 1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx.filter((_, k) => true));
  g.computeVertexNormals();
  // orient so the cap faces `outward`
  const nn = g.attributes.normal;
  if (nn.getX(0) * outward.x + nn.getY(0) * outward.y + nn.getZ(0) * outward.z < 0) {
    const ix = g.index.array;
    for (let k = 0; k < ix.length; k += 3) { const t = ix[k + 1]; ix[k + 1] = ix[k + 2]; ix[k + 2] = t; }
    g.computeVertexNormals();
  }
  return g;
}
// Paint a texture pixel by pixel for a lofted surface.
function paintLoft(stations, w, h, colorFn) {
  return canvasTex(w, h, (ctx) => {
    const img = ctx.createImageData(w, h);
    const d = img.data;
    for (let px = 0; px < w; px++) {
      const u = (px + 0.5) / w;
      const s = sampleStations(stations, u * (stations.length - 1));
      for (let py = 0; py < h; py++) {
        let r = 0, g = 0, b = 0;
        for (let sy = 0; sy < 3; sy++) {
          const v = 1 - (py + (sy + 0.5) / 3) / h;
          const th = -Math.PI / 2 + v * Math.PI * 2;
          const [z, y] = sectionPoint(s, th);
          const col = colorFn(s, th, z, y);
          r += col[0]; g += col[1]; b += col[2];
        }
        const k = (py * w + px) * 4;
        d[k] = r / 3; d[k + 1] = g / 3; d[k + 2] = b / 3; d[k + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  });
}
// NACA-style cambered aerofoil, leading edge at origin, trailing edge toward -x.
function aerofoilShape(chord, thick = 0.1, camber = 0.05) {
  const N = 28, up = [], lo = [];
  for (let i = 0; i <= N; i++) {
    const t = (1 - Math.cos((i / N) * Math.PI)) / 2;
    const yt = 5 * thick * chord * (0.2969 * Math.sqrt(t) - 0.126 * t - 0.3516 * t * t + 0.2843 * t ** 3 - 0.1036 * t ** 4);
    const yc = -camber * chord * 4 * t * (1 - t); // inverted camber → downforce
    up.push([-t * chord, yc + yt]);
    lo.push([-t * chord, yc - yt]);
  }
  const sh = new THREE.Shape();
  sh.moveTo(up[0][0], up[0][1]);
  for (let i = 1; i <= N; i++) sh.lineTo(up[i][0], up[i][1]);
  for (let i = N - 1; i >= 1; i--) sh.lineTo(lo[i][0], lo[i][1]);
  sh.closePath();
  return sh;
}
// A wing element: span along z, positioned with leading edge at (x, y), pitched by aoa (deg, TE up).
function wingElement({ chord, thick = 0.1, camber = 0.05, aoa = 0, span, x, y, warp = () => 0, sweep = () => 0, zOff = 0 }) {
  let g = new THREE.ExtrudeGeometry(aerofoilShape(chord, thick, camber), { depth: span, bevelEnabled: false, curveSegments: 1, steps: 24 });
  g.translate(0, 0, -span / 2);
  g.rotateZ(-THREE.MathUtils.degToRad(aoa));
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const z = p.getZ(i);
    p.setXYZ(i, p.getX(i) + x + sweep(z), p.getY(i) + y + warp(z), z + zOff);
  }
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = BGU.mergeVertices(g, 1e-5);
  g.computeVertexNormals();
  return g;
}
function plate(points, thickness, { bevel = 0.0025 } = {}) {
  const sh = new THREE.Shape();
  sh.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) sh.lineTo(points[i][0], points[i][1]);
  sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, {
    depth: Math.max(0.0005, thickness - bevel * 2), bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 8,
  });
  g.translate(0, 0, -thickness / 2 + bevel);
  return g;
}
function smoothPlate(points, thickness, opts) {
  // points through a closed Catmull-Rom curve for organic outlines
  const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(p[0], p[1], 0)), true, 'centripetal');
  const pts = curve.getPoints(points.length * 10).map((v) => [v.x, v.y]);
  return plate(pts, thickness, opts);
}
// Aero-section strut between two points (suspension arm).
const _up = new THREE.Vector3(0, 1, 0);
function strut(a, b, chord = 0.04, thick = 0.012, mat) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const d = B.clone().sub(A); const len = d.length(); d.normalize();
  let wide = new THREE.Vector3().crossVectors(d, _up);
  if (wide.lengthSq() < 1e-6) wide.set(1, 0, 0);
  wide.normalize();
  const thin = new THREE.Vector3().crossVectors(wide, d).normalize();
  const g = new THREE.CylinderGeometry(0.5, 0.5, 1, 18, 1);
  const m = new THREE.Mesh(g, mat);
  const basis = new THREE.Matrix4().makeBasis(wide, d, thin);
  m.quaternion.setFromRotationMatrix(basis);
  m.scale.set(chord, len, thick);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  return m;
}

// =====================================================================
// Materials
// =====================================================================
const C = {
  navy: '#141f49', red: '#d1001d', yellow: '#ffc400', black: '#0c0d10', carbon: '#191a1f',
};
const paintMats = []; // all livery materials react to the finish toggle
function paint(opts) {
  const m = new THREE.MeshPhysicalMaterial({ roughness: 0.48, metalness: 0.0, clearcoat: 0.25, clearcoatRoughness: 0.42, ...opts });
  paintMats.push(m);
  return m;
}
const carbonTex = canvasTex(256, 256, (ctx, w, h) => {
  // 2x2 twill weave
  const cell = 32;
  for (let y = 0; y < h / cell; y++) for (let x = 0; x < w / cell; x++) {
    const along = (x + y) % 4 < 2;
    const g = ctx.createLinearGradient(x * cell, y * cell, along ? (x + 1) * cell : x * cell, along ? y * cell : (y + 1) * cell);
    g.addColorStop(0, '#16171b'); g.addColorStop(0.5, '#2c2e35'); g.addColorStop(1, '#141519');
    ctx.fillStyle = g; ctx.fillRect(x * cell, y * cell, cell, cell);
  }
}, { repeat: [24, 24] });
const carbon = new THREE.MeshPhysicalMaterial({ map: carbonTex, roughness: 0.38, metalness: 0.1, clearcoat: 0.9, clearcoatRoughness: 0.12 });
const carbonFloor = new THREE.MeshPhysicalMaterial({ map: carbonTex, roughness: 0.55, metalness: 0.05, clearcoat: 0.35, clearcoatRoughness: 0.35 });
const carbonUV = new THREE.MeshPhysicalMaterial({ map: carbonTex.clone(), roughness: 0.38, metalness: 0.1, clearcoat: 0.9, clearcoatRoughness: 0.12 });
carbonUV.map.repeat.set(6, 6); carbonUV.map.needsUpdate = true;
const satinBlack = new THREE.MeshPhysicalMaterial({ color: C.black, roughness: 0.55, clearcoat: 0.2, clearcoatRoughness: 0.5 });
const matteBlack = new THREE.MeshStandardMaterial({ color: '#050506', roughness: 0.9 });
const navyPaint = paint({ color: C.navy });
const redPaint = paint({ color: C.red });
const yellowPaint = paint({ color: C.yellow });
const titanium = new THREE.MeshStandardMaterial({ color: '#9a8f86', metalness: 1, roughness: 0.32 });
const darkMetal = new THREE.MeshStandardMaterial({ color: '#17191e', metalness: 0.85, roughness: 0.5 });
const mirrorMat = new THREE.MeshStandardMaterial({ color: '#d8dbe2', metalness: 1, roughness: 0.02 });

// =====================================================================
// Car
// =====================================================================
const car = new THREE.Group();
scene.add(car);
const add = (mesh, parent = car) => { mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh; };

// ---- Fuselage: nose → monocoque → cockpit → airbox → engine cover → crash structure
const D = { dip: 0, dipW: 0.2 };
const FUS = [
  { x: 2.72, w: 0.028, yB: 0.212, yM: 0.232, yT: 0.252, nT: 2.2, nB: 2.2, ...D },
  { x: 2.60, w: 0.060, yB: 0.186, yM: 0.230, yT: 0.276, nT: 2.4, nB: 2.6, ...D },

// ---- Wheels (tyre with sidewall graphics, rim, wheel cover, brake drum)
const TYRES = [
  { id: 'soft', name: '소프트', c: '#ff2a2a', label: 'SOFT' },
  { id: 'medium', name: '미디엄', c: '#ffd21f', label: 'MEDIUM' },
  { id: 'hard', name: '하드', c: '#f4f4f4', label: 'HARD' },
  { id: 'inter', name: '인터', c: '#2fcf4f', label: 'INTERMEDIATE' },
  { id: 'wet', name: '웻', c: '#2f7bff', label: 'WET' },
];
const R = 0.36, RIM = 0.229;
const PHI0 = Math.PI * 7 / 6, PHI1 = -Math.PI / 6, NPROF = 96;
function tyreProfile(width) {
  const rc = (RIM + R) / 2, hr = (R - RIM) / 2, hw = width / 2 + 0.006, n = 5;
  const pts = [];
  pts.push(new THREE.Vector2(RIM - 0.002, -width / 2 + 0.018));
  for (let i = 0; i <= NPROF; i++) {
    const phi = PHI0 + (PHI1 - PHI0) * (i / NPROF);
    const c = Math.cos(phi), s = Math.sin(phi);
    const a = hw * Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
    const r = rc + hr * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
    pts.push(new THREE.Vector2(Math.max(r, RIM), a));
  }
  pts.push(new THREE.Vector2(RIM - 0.002, width / 2 - 0.018));
  return pts;
}
const vOfPhi = (phi) => (1 + ((PHI0 - phi) / (PHI0 - PHI1)) * NPROF) / (NPROF + 2);
const tyreTexCache = {};

  const b = document.createElement('button');
  b.textContent = f.n; b.dataset.k = k;
  b.addEventListener('click', () => setFinish(k));
  $('finishBtns').appendChild(b);
});
function setTyre(t) {
  tyreMat.map = tyreTexture(t); tyreMat.needsUpdate = true;
  document.querySelectorAll('#tyreBtns button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.k === t.id));
}
TYRES.forEach((t) => {
  const b = document.createElement('button');
  b.innerHTML = `<span class="dot" style="--c:${t.c}"></span>${t.name}`;
  b.dataset.k = t.id;
  b.addEventListener('click', () => setTyre(t));
  $('tyreBtns').appendChild(b);
});
let drsOpen = false, drsAngle = 0;
$('drsBtn').addEventListener('click', () => {
  drsOpen = !drsOpen;
  $('drsBtn').setAttribute('aria-pressed', drsOpen);
  $('drsBtn').textContent = drsOpen ? 'DRS 닫기' : 'DRS 열기';
});
function setSpin(on) { controls.autoRotate = on; $('spinBtn').setAttribute('aria-pressed', on); }
$('spinBtn').addEventListener('click', () => setSpin(!controls.autoRotate));
$('hqBtn').addEventListener('click', () => setHQ(!hq));
controls.addEventListener('start', () => { camTween = null; });

frameView();
applyPreset('studio');
setFinish('matte');
setTyre(TYRES[0]);
setHQ(hq);

// =====================================================================
// Loop
// =====================================================================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.fov = lens().fov; frameView();
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setSize(innerWidth, innerHeight);
  gtao.setSize(innerWidth, innerHeight);
  mirror.getRenderTarget().setSize(Math.min(2048, innerWidth * renderer.getPixelRatio()), Math.min(2048, innerHeight * renderer.getPixelRatio()));
});

const clock = new THREE.Clock();
let first = true;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt / 1.3);
    const e = camTween.t < 0.5 ? 4 * camTween.t ** 3 : 1 - Math.pow(-2 * camTween.t + 2, 3) / 2;
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();
  const goal = drsOpen ? 0.42 : 0;
  if (Math.abs(goal - drsAngle) > 1e-4) {
    drsAngle += (goal - drsAngle) * Math.min(1, dt * 9);
    drsPivot.rotation.z = drsAngle;
    csDirty = true;
  }
  rainMat.emissiveIntensity = (Math.floor(t * 2) % 2 === 0) ? 6 : 0.2;
  if (csDirty) { renderContactShadow(); csDirty = false; }
  composer.render();
  if (first) { first = false; $('loading').classList.add('done'); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
<script>
  // Shown only if the module above fails (e.g. no network for the 3D library or no WebGL).
  setTimeout(() => {
    const l = document.getElementById('loading');
    if (l && !l.classList.contains('done')) document.getElementById('loadMsg').textContent =
      '3D 라이브러리를 불러오지 못했거나 이 기기에서 WebGL을 쓸 수 없습니다. 인터넷 연결을 확인하고 새로고침해 주세요.';
  }, 20000);
</script>
