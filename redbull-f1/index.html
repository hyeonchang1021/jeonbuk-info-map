function wingElement({ chord, thick = 0.1, camber = 0.05, aoa = 0, span, x, y, warp = () => 0, sweep = () => 0, zOff = 0 }) {
  let g = new THREE.ExtrudeGeometry(aerofoilShape(chord, thick, camber), { depth: span, bevelEnabled: false, curveSegments: 1, steps: q(140) });

}

    depth: Math.max(0.0005, thickness - bevel * 2), bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 24,

}

const _up = new THREE.Vector3(0, 1, 0);
function strut(a, b, chord = 0.04, thick = 0.012, mat) {

  let wide = new THREE.Vector3().crossVectors(d, _up);
  if (wide.lengthSq() < 1e-6) wide.set(1, 0, 0);
  wide.normalize();
  const thin = new THREE.Vector3().crossVectors(wide, d).normalize();
  const g = new THREE.CylinderGeometry(0.5, 0.5, 1, 40, 2);
  const m = new THREE.Mesh(g, mat);

  m.quaternion.setFromRotationMatrix(basis);

// colour, normal and anisotropy (the sheen follows each tow, so the weave flips in the light)
const CF = (() => {
  const S = 512, cell = 32, H = new Float32Array(S * S);
  const col = new Uint8ClampedArray(S * S * 4), an = new Uint8ClampedArray(S * S * 4);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const cx = Math.floor(x / cell), cy = Math.floor(y / cell);
    const along = (cx + cy) % 4 < 2;
    const lx = ((x % cell) + 0.5) / cell, ly = ((y % cell) + 0.5) / cell;
    const across = along ? ly : lx, len = along ? lx : ly;
    const crown = Math.sin(Math.PI * across);
    const fib = Math.sin(across * Math.PI * 2 * 9 + hash2(cx, cy) * 6.28) * 0.05 + (hash2(x * 7, y * 3) - 0.5) * 0.05;
    const ends = Math.pow(Math.sin(Math.PI * len), 0.25);              // tow dives under at the cell ends
    const hgt = Math.pow(crown, 0.55) * ends * 0.9 + fib;
    H[y * S + x] = hgt;
    const shade = 14 + crown * ends * 20 + (along ? 5 : 0) + fib * 50 + hash2(cx * 3, cy * 5) * 4;
    const k = (y * S + x) * 4;
    col[k] = shade; col[k + 1] = shade + 1; col[k + 2] = shade + 4; col[k + 3] = 255;
    an[k] = along ? 255 : 128; an[k + 1] = along ? 128 : 255; an[k + 2] = 255 * (0.35 + 0.65 * crown); an[k + 3] = 255;
  }

// ---- Wheels (tyre with raised sidewall lettering, rim, wheel cover, brake duct)
const TYRES = [
  { id: 'soft', name: '소프트', c: '#ff2a2a', label: 'SOFT' },
  { id: 'medium', name: '미디엄', c: '#ffd21f', label: 'MEDIUM' },
  { id: 'hard', name: '하드', c: '#f4f4f4', label: 'HARD' },
  { id: 'inter', name: '인터', c: '#2fcf4f', label: 'INTERMEDIATE' },
  { id: 'wet', name: '웻', c: '#2f7bff', label: 'WET' },
];
const R = 0.36, RIM = 0.229;
const PHI0 = Math.PI * 7 / 6, PHI1 = -Math.PI / 6, NPROF = q(220);
function tyreProfile(width) {
  const rc = (RIM + R) / 2, hr = (R - RIM) / 2, hw = width / 2 + 0.006, n = 5;
  const pts = [new THREE.Vector2(RIM - 0.002, -width / 2 + 0.018)];
  for (let i = 0; i <= NPROF; i++) {
    const phi = PHI0 + (PHI1 - PHI0) * (i / NPROF);
    const c = Math.cos(phi), s = Math.sin(phi);
    const a = hw * Math.sign(c) * Math.pow(Math.abs(c), 2 / n);
    const r = rc + hr * Math.sign(s) * Math.pow(Math.abs(s), 2 / n);
    pts.push(new THREE.Vector2(Math.max(r, RIM), a));
  }
  pts.push(new THREE.Vector2(RIM - 0.002, width / 2 - 0.018));
  return pts;
}
const vOfPhi = (phi) => (1 + ((PHI0 - phi) / (PHI0 - PHI1)) * NPROF) / (NPROF + 2);
// mode: 'color' | 'height' | 'rough' — the same layout drives all three maps so they line up
function drawTyre(ctx, w, h, t, mode) {
  const C = mode === 'color', Hm = mode === 'height';
  const pick = (c, hv, r) => (C ? c : Hm ? hv : r);
  const yOf = (phi) => (1 - vOfPhi(phi)) * h;
  const rand = rng(1234);
  ctx.fillStyle = pick('#16171a', '#808080', '#d6d6d6'); ctx.fillRect(0, 0, w, h);
  // sidewalls are moulded smoother than the scrubbed tread
  ctx.fillStyle = pick('#17181b', '#808080', '#b4b4b4');
  ctx.fillRect(0, yOf(-0.55), w, yOf(1.12) - yOf(-0.55));
  ctx.fillRect(0, yOf(2.02), w, h - yOf(2.02));
  // tread: graining streaks, rubber pick-up (marbles) and blistering
  const t0 = yOf(1.95), t1 = yOf(1.18);
  for (let i = 0; i < 16000; i++) {
    const y = t1 + rand() * (t0 - t1), lite = rand() < 0.5;
    ctx.fillStyle = pick(`rgba(255,255,255,${rand() * 0.035})`, lite ? 'rgba(150,150,150,.3)' : 'rgba(105,105,105,.3)', lite ? 'rgba(235,235,235,.18)' : 'rgba(175,175,175,.18)');
    ctx.fillRect(rand() * w, y, 2 + rand() * 36, 1 + rand() * 1.6);
  }
  for (let i = 0; i < 900; i++) {
    const y = t1 + rand() * (t0 - t1), r = 1.5 + rand() * 3.5, x = rand() * w;
    ctx.fillStyle = pick('#0e0e10', '#c4c4c4', '#f0f0f0');
    ctx.beginPath(); ctx.ellipse(x, y, r * 1.6, r, 0, 0, Math.PI * 2); ctx.fill();
  }
  // compound bands (raised) with moulded grooves either side
  ctx.fillStyle = pick(t.c, '#b6b6b6', '#9a9a9a');
  ctx.fillRect(0, yOf(-0.30) - 5, w, 10);
  ctx.fillRect(0, yOf(0.36) - 3, w, 6);
  if (!C) { ctx.fillStyle = pick('', '#555', '#c8c8c8'); for (const p of [-0.42, -0.18, 0.28, 0.46]) ctx.fillRect(0, yOf(p) - 1, w, 2); }
  // rim-protector ridge near the bead
  if (Hm) { ctx.fillStyle = '#c0c0c0'; ctx.fillRect(0, yOf(-0.48) - 3, w, 6); }
  // raised lettering + small moulded text
  ctx.save();
  ctx.translate(0, yOf(0.03));
  ctx.scale(1, -1);
  ctx.textBaseline = 'middle';
  for (let k = 0; k < 2; k++) {
    const x0 = k * w / 2;
    ctx.font = '900 italic 46px system-ui, sans-serif';
    ctx.fillStyle = pick('#f2f2f2', '#e0e0e0', '#8c8c8c'); ctx.fillText('FORMULA SLICK', x0 + 120, 0);
    ctx.fillStyle = pick(t.c, '#e0e0e0', '#8c8c8c'); ctx.fillText(t.label, x0 + 620, 0);
    ctx.fillStyle = pick('#f2f2f2', '#e0e0e0', '#8c8c8c'); ctx.fillText('18"', x0 + 1300, 0);
    ctx.font = '700 22px system-ui, sans-serif';
    ctx.fillStyle = pick('#3a3b40', '#c4c4c4', '#a8a8a8'); ctx.fillText('305/670 R18  ·  TUBELESS  ·  DIRECTION ▶  ·  MADE FOR RACING USE ONLY', x0 + 1480, 0);
  }
  ctx.restore();
}
const tyreTexCache = {};
function tyreTexture(t) {
  if (tyreTexCache[t.id]) return tyreTexCache[t.id];
  const W = q(4096), Hh = q(512);
  const map = canvasTex(W, Hh, (ctx, w, h) => drawTyre(ctx, w, h, t, 'color'));
  const rough = canvasTex(W, Hh, (ctx, w, h) => drawTyre(ctx, w, h, t, 'rough'), { srgb: false });

const dust = (() => {

// hide the atmosphere from depth/normal based passes so it never casts AO or confuses focus

let currentPreset = 'studio';
let ptOn = false;
const ptFloorMat = new THREE.MeshPhysicalMaterial({ color: '#0f1115', roughness: 0.18, metalness: 0, specularIntensity: 0.6 });
function applyPreset(k) {

}

// =====================================================================
// Post-processing
// =====================================================================
const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));

// "Sculpt view": every part in a pastel clay matcap (keeps the baked surface normals so seams,
// fasteners and the carbon weave read like sculpted cavities), revealed/hidden with a diagonal wipe.
const clayRT = new THREE.WebGLRenderTarget(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio(), { type: THREE.HalfFloatType, samples: 4 });
const wipe = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, tClay: { value: null }, amount: { value: 1 }, aspect: { value: innerWidth / innerHeight } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform sampler2D tClay; uniform float amount; uniform float aspect; varying vec2 vUv;
    void main(){

      float s = vUv.x * 0.62 + (1.0 - vUv.y) * 0.38;          // diagonal sweep coordinate
      float edge = (1.0 - amount) * 1.25 - 0.12;

composer.addPass(wipe);
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.output = GTAOPass.OUTPUT.Default;

{ const r0 = gtao.render.bind(gtao); gtao.render = (...a) => withoutFx(() => r0(...a)); }

{ const r0 = bokeh.render.bind(bokeh); bokeh.render = (...a) => withoutFx(() => r0(...a)); }
bokeh.enabled = false;
composer.addPass(bokeh);

composer.addPass(new OutputPass());

const film = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, grain: { value: 0.02 }, vignette: { value: 0.22 }, aberration: { value: 0.00012 } },

  fragmentShader: `uniform sampler2D tDiffuse; uniform float time, grain, vignette, aberration; varying vec2 vUv;
    float rnd(vec2 p){ return fract(sin(dot(p + time, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){

let hq = !isMobile;
function setHQ(on) {
  hq = on;
  gtao.enabled = on; bloom.enabled = on;
  bokeh.enabled = on && !!PRESETS[currentPreset].fx;
  $('hqBtn').setAttribute('aria-pressed', on);
}

// ---- clay materials
const PASTEL = ['#e3a1c4', '#a6d6ae', '#b7a5e4', '#e6d3a3', '#9cc7e6', '#eeb298', '#c4e096', '#d6b0e6', '#9fe0d6', '#f0c7a0'];
const matcap = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  const g = ctx.createRadialGradient(w * 0.38, h * 0.32, 4, w * 0.5, h * 0.5, w * 0.5);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.18, '#e9e9e9'); g.addColorStop(0.6, '#9a9a9a'); g.addColorStop(0.92, '#3a3a3a'); g.addColorStop(1, '#202020');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(w / 2, h / 2, w / 2, 0, Math.PI * 2); ctx.fill();
  const r = ctx.createRadialGradient(w * 0.5, h * 0.95, 2, w * 0.5, h * 0.95, w * 0.45);   // bounce light from below
  r.addColorStop(0, 'rgba(255,255,255,0.25)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = r; ctx.fillRect(0, 0, w, h);
});
const carMeshes = [];
car.updateMatrixWorld(true);
car.traverse((o) => {
  if (!o.isMesh) return;
  const m = o.material;
  const bb = new THREE.Box3().setFromObject(o), c = bb.getCenter(new THREE.Vector3());
  const keyStr = `${c.x.toFixed(1)}|${c.y.toFixed(1)}|${Math.abs(c.z).toFixed(1)}`;   // mirrored parts share a group colour
  let hsh = 0; for (const ch of keyStr) hsh = (hsh * 31 + ch.charCodeAt(0)) | 0;

// amount: 1 = full render, 0 = full clay
let wipeAmount = 1, wipeTarget = 1, wipeSpeed = 0.6, revealTimer = 0;
function setView(mode) {

}

// ---- path tracing mode (loaded on demand)
let pt = null;
const ptHidden = () => [mirror, csPlane, dome, fx];
function ptBackground(p) {
  const t = canvasTex(16, 512, (ctx, w, h) => {

}

    btn.disabled = true;

const CAMS = [

let camTween = null;
CAMS.forEach((c, i) => {

const FINISHES = {

let drsOpen = false, drsAngle = 0;

function setSpin(on) { if (on && ptOn) setPT(false); controls.autoRotate = on; $('spinBtn').setAttribute('aria-pressed', on); }
$('spinBtn').addEventListener('click', () => setSpin(!controls.autoRotate));
$('hqBtn').addEventListener('click', () => setHQ(!hq));
$('viewBtns').addEventListener('click', (e) => {

// restart path tracing only for visible camera motion (damping keeps emitting tiny 'change' events)
const ptCamPos = new THREE.Vector3(), ptCamQuat = new THREE.Quaternion();
controls.addEventListener('change', () => {

frameView();
applyPreset('studio');
setFinish('matte');
setTyre(TYRES[0]);
setHQ(hq);

// =====================================================================
// Loop
// =====================================================================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.fov = lens().fov; frameView();
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setSize(innerWidth, innerHeight);

const clock = new THREE.Clock();
let first = true;
function tick() {

    const e = camTween.t < 0.5 ? 4 * camTween.t ** 3 : 1 - Math.pow(-2 * camTween.t + 2, 3) / 2;
    camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e);
    if (camTween.t >= 1) camTween = null;

  controls.update();
  const goal = drsOpen ? 0.42 : 0;
  if (Math.abs(goal - drsAngle) > 1e-4) {
    drsAngle += (goal - drsAngle) * Math.min(1, dt * 9);

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
