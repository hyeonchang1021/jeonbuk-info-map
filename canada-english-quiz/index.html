<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐나다 현장 영어 퀴즈</title>
<style>
:root{
  --bg:#f5f2ec; --card:#fffdf9; --ink:#1e1b17; --muted:#6e675d; --line:#e0d9cd;
  --accent:#23406b; --accent-soft:#e6ecf5; --mark:#c8321f;
  --ok:#1c7446; --ok-bg:#e4f2e9; --no:#b3261e; --no-bg:#fbe8e6;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15161a; --card:#1e2025; --ink:#ebe7df; --muted:#a09a90; --line:#353840;
    --accent:#9db9ea; --accent-soft:#252d3d; --mark:#e5604e;
    --ok:#74d39c; --ok-bg:#1b3023; --no:#f2938a; --no-bg:#3a2321;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  line-height:1.55; word-break:keep-all;
}
.wrap{max-width:680px; margin:0 auto; padding:28px 16px 64px}
button{font:inherit; color:inherit}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.eyebrow{font-size:.8rem; letter-spacing:.04em; color:var(--muted); display:flex; align-items:center; gap:9px}
.eyebrow::before{content:""; width:8px; height:8px; background:var(--mark); transform:rotate(45deg); border-radius:1px}
h1{font-size:clamp(1.6rem,5vw,2.1rem); line-height:1.25; margin:10px 0 8px; letter-spacing:-.02em}
.lede{color:var(--muted); margin:0 0 24px}

.panel{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px}
.field{margin-bottom:18px}
.label{display:block; font-size:.85rem; color:var(--muted); margin-bottom:8px}
.seg{display:flex; flex-wrap:wrap; gap:8px}
.seg button{
  padding:9px 14px; border:1px solid var(--line); border-radius:999px;
  background:transparent; cursor:pointer; min-height:42px;
}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.info{font-size:.9rem; color:var(--muted); margin:4px 0 14px}
.primary{
  width:100%; padding:14px 18px; border:0; border-radius:12px;
  background:var(--ink); color:var(--bg); font-weight:700; cursor:pointer; min-height:52px;
}
.primary:disabled{opacity:.35; cursor:default}
.ghost{
  padding:12px 16px; border:1px solid var(--line); border-radius:12px;
  background:transparent; cursor:pointer; min-height:48px;
}
.ghost:hover{border-color:var(--ink)}
.source{font-size:.8rem; color:var(--muted); margin-top:18px}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:.9rem; color:var(--muted); margin-bottom:10px; font-variant-numeric:tabular-nums}
.top .quit{border:0; background:none; color:var(--muted); cursor:pointer; padding:6px 0; text-decoration:underline; text-underline-offset:3px}
.track{height:4px; background:var(--line); border-radius:4px; overflow:hidden; margin-bottom:22px}
.track i{display:block; height:100%; width:0; background:var(--ink); transition:width .25s}
.meta{font-size:.82rem; color:var(--muted)}
.en{
  font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
  font-size:clamp(1.45rem,5.2vw,2rem); line-height:1.3; letter-spacing:-.01em;
  margin:8px 0 14px; word-break:normal; overflow-wrap:anywhere;
}
.say{
  display:inline-flex; align-items:center; gap:6px; padding:7px 12px;
  border:1px solid var(--line); border-radius:999px; background:transparent;
  font-size:.85rem; color:var(--muted); cursor:pointer;
}
.say:hover{border-color:var(--ink); color:var(--ink)}
.say svg{width:15px; height:15px}
.ask{font-size:.9rem; color:var(--muted); margin:20px 0 10px}
.opts{display:grid; gap:10px}
.opt{
  display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  padding:13px 14px; min-height:54px; border:1px solid var(--line); border-radius:12px;
  background:var(--card); cursor:pointer;
}
.opt .num{
  flex:none; width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
  display:grid; place-items:center; font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums;
}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default; color:inherit}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.sel .num{background:var(--accent); border-color:var(--accent); color:var(--card)}
.opt.correct{border-color:var(--ok); background:var(--ok-bg)}
.opt.correct .num{background:var(--ok); border-color:var(--ok); color:var(--card)}
.opt.wrong{border-color:var(--no); background:var(--no-bg)}
.opt.wrong .num{background:var(--no); border-color:var(--no); color:var(--card)}
.opt.dim{opacity:.55}

.fb{margin-top:14px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:var(--card)}
.fb.ok{border-color:var(--ok)}
.fb.no{border-color:var(--no)}
.fb .verdict{font-weight:700; margin-bottom:4px}
.fb.ok .verdict{color:var(--ok)}
.fb.no .verdict{color:var(--no)}
.fb .line{font-size:.92rem}
.fb .sub{font-size:.85rem; color:var(--muted); margin-top:4px}
.actions{margin-top:16px}
.keys{font-size:.78rem; color:var(--muted); text-align:center; margin-top:10px}
@media (hover:none){ .keys{display:none} }

.score{font-size:clamp(2.6rem,10vw,3.6rem); font-weight:800; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums}
.pct{color:var(--muted); margin:6px 0 2px}
.btns{display:grid; gap:10px; margin:22px 0 8px}
h2{font-size:1.05rem; margin:28px 0 10px}
.review{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.review li{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
.r-en{font-family:Georgia,"Iowan Old Style","Times New Roman",serif; font-size:1.1rem; line-height:1.35; word-break:normal}
.r-ok{color:var(--ok); font-size:.92rem; margin-top:6px}
.r-no{color:var(--no); font-size:.92rem}
.r-meta{font-size:.78rem; color:var(--muted); margin-top:6px}
@media (prefers-reduced-motion: reduce){ .track i{transition:none} }
</style>
</head>
<body>
<main class="wrap">

  <!-- 시작 화면 -->
  <section id="start">
    <div class="eyebrow">캐나다 현장 영어 회화 · 대화편</div>
    <h1>영어 문장 뜻 맞히기</h1>
    <p class="lede">영어 문장을 보고 알맞은 한글 뜻을 다섯 개 중에서 고르는 퀴즈입니다. 마트 캐셔, 웨이터(서버), 옷 가게 점원 대화에서 뽑은 <span id="total"></span>문장이 들어 있습니다.</p>

    <div class="panel">
      <div class="field">
        <span class="label" id="l-cat">직종</span>
        <div class="seg" role="group" aria-labelledby="l-cat" data-key="cat">
          <button type="button" data-val="all" aria-pressed="true">전체</button>
          <button type="button" data-val="m" aria-pressed="false">마트 캐셔</button>
          <button type="button" data-val="s" aria-pressed="false">웨이터(서버)</button>
          <button type="button" data-val="c" aria-pressed="false">옷 가게 점원</button>
        </div>
      </div>
      <div class="field">
        <span class="label" id="l-who">누가 하는 말</span>
        <div class="seg" role="group" aria-labelledby="l-who" data-key="who">
          <button type="button" data-val="all" aria-pressed="true">전체</button>
          <button type="button" data-val="me" aria-pressed="false">내가 하는 말</button>
          <button type="button" data-val="cu" aria-pressed="false">손님이 하는 말</button>
        </div>
      </div>
      <div class="field">
        <span class="label" id="l-count">문제 수</span>
        <div class="seg" role="group" aria-labelledby="l-count" data-key="count">
          <button type="button" data-val="10" aria-pressed="true">10</button>
          <button type="button" data-val="20" aria-pressed="false">20</button>
          <button type="button" data-val="30" aria-pressed="false">30</button>
          <button type="button" data-val="all" aria-pressed="false">전체</button>
        </div>
      </div>
      <div class="field">
        <span class="label" id="l-instant">채점 방식</span>
        <div class="seg" role="group" aria-labelledby="l-instant" data-key="instant">
          <button type="button" data-val="no" aria-pressed="true">고른 뒤 정답 확인 버튼</button>
          <button type="button" data-val="yes" aria-pressed="false">고르면 바로 채점</button>
        </div>
      </div>
      <p class="info" id="poolInfo"></p>
      <button type="button" class="primary" id="startBtn">시작하기</button>
    </div>
    <p class="source">문장 출처: 캐나다 현장 영어 회화 · 대화편 (대화 87개, 영어권 주 기준)</p>
  </section>

  <!-- 문제 화면 -->
  <section id="quiz" hidden>
    <div class="top">
      <span id="qNum"></span>
      <span id="qScore"></span>
      <button type="button" class="quit" id="quitBtn">그만하기</button>
    </div>
    <div class="track" aria-hidden="true"><i id="bar"></i></div>

    <div class="meta" id="qMeta"></div>
    <p class="en" id="qEn" lang="en"></p>
    <button type="button" class="say" id="sayBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      발음 듣기
    </button>

    <p class="ask">알맞은 뜻을 고르세요.</p>
    <div class="opts" id="opts"></div>

    <div class="fb" id="fb" role="status" aria-live="polite" hidden>
      <div class="verdict" id="fbVerdict"></div>
      <div class="line" id="fbAnswer"></div>
      <div class="sub" id="fbSit"></div>
      <div class="sub" id="fbNote"></div>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="act" disabled>정답 확인</button>
    </div>
    <p class="keys">키보드: 1~5로 고르고 Enter로 확인 · 다음</p>
  </section>

  <!-- 결과 화면 -->
  <section id="result" hidden>
    <div class="eyebrow">결과</div>
    <div class="score" id="rScore" style="margin-top:12px"></div>
    <p class="pct" id="rPct"></p>
    <p id="rMsg" style="margin:0"></p>

    <div class="btns">
      <button type="button" class="primary" id="retryWrong">틀린 문제만 다시 풀기</button>
      <button type="button" class="ghost" id="retryNew">같은 설정으로 새로 풀기</button>
      <button type="button" class="ghost" id="goHome">처음으로</button>
    </div>

    <div id="rWrongWrap">
      <h2>틀린 문장</h2>
      <ul class="review" id="rList"></ul>
    </div>
  </section>

</main>

<script>
(function(){
'use strict';

/* [직종, 화자, 상황, 영어, 한글, 뜻이 비슷한 묶음(서로 보기로 안 나옴), 메모] */
const RAW=[
/* ── 마트 캐셔 ── */
['m','me','다음 손님',"I can help whoever's next.",'다음 분 도와드릴게요.'],
['m','me','인사',"Hi there, how's it going?",'안녕하세요.','hi','가볍게 건네는 인사.'],
['m','cu','인사',"Not bad. How are you?",'괜찮아요. 잘 지내요?','hi'],
['m','me','인사',"I'm good, thanks!",'저도 좋아요, 감사해요.'],

['m','me','인사',"Let me get someone to check for you.",'직원 불러서 확인해 드릴게요.','staff'],

['m','cu','대기',"No worries.",'괜찮아요.'],

['m','cu','포인트',"Can I use my phone number?",'전화번호로 해도 돼요?'],
['m','me','포인트',"Sure, go ahead and type it in.",'네, 여기에 입력해 주세요.'],

['m','me','가격 확인',"You're right. Let me fix that.",'맞네요. 고쳐 드릴게요.'],

['m','cu','연령 확인',"I don't have it on me.",'지금 안 가지고 있어요.'],

['m','me','총액',"Your total is forty-two fifty.",'총 42달러 50센트예요.'],

['s','me','맞이',"Great. What name is it under?",'네. 어느 분 성함으로 예약하셨어요?'],

['s','cu','대기',"Can we sit at the bar instead?",'바 자리에 앉아도 돼요?'],

function bigrams(s){
  const t=s.replace(/[\s.,?!·~()\/]/g,'');
  const set=new Set();
  for(let i=0;i<t.length-1;i++) set.add(t.slice(i,i+2));
  return set;
}
function sim(a,b){
  if(!a.size||!b.size) return 0;
  let n=0; a.forEach(x=>{ if(b.has(x)) n++; });
  return n/(a.size+b.size-n);
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

  for(const c of ITEMS){
    if(c.cat!==it.cat||seen.has(c.ko)) continue;
    if(it.g&&c.g===it.g) continue;
    if(c.en===it.en) continue;
    const s=sim(it.bg,c.bg);
    if(s>=0.7) continue;
    seen.add(c.ko);
    pool.push({ko:c.ko,s:s});
  }
  pool.sort((a,b)=>b.s-a.s);
  const near=shuffle(pool.slice(0,6)).slice(0,2);
  const far=shuffle(pool.slice(6)).slice(0,2);
  return shuffle([it.ko].concat(near.map(x=>x.ko),far.map(x=>x.ko)));
}

const $=s=>document.querySelector(s);
const state={cat:'all',who:'all',count:'10',instant:'no',queue:[],idx:0,score:0,log:[],picked:null,revealed:false,choices:[]};
const canSpeak=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';

function show(name){
  ['start','quiz','result'].forEach(id=>{ $('#'+id).hidden=(id!==name); });
  window.scrollTo(0,0);
}
function currentPool(){
  return ITEMS.filter(it=>(state.cat==='all'||it.cat===state.cat)&&(state.who==='all'||it.who===state.who));
}
function questionCount(pool){
  return state.count==='all'?pool.length:Math.min(parseInt(state.count,10),pool.length);
}
function updateInfo(){
  const pool=currentPool();
  $('#poolInfo').textContent='선택한 범위 '+pool.length+'문장 중 '+questionCount(pool)+'문제를 무작위로 냅니다.';
}

function begin(items){
  state.queue=items; state.idx=0; state.score=0; state.log=[];
  show('quiz');
  showQuestion();
}
function startNew(){
  const pool=currentPool();
  begin(shuffle(pool).slice(0,questionCount(pool)));
}

function showQuestion(){
  const it=state.queue[state.idx];
  state.picked=null; state.revealed=false;
  state.choices=buildChoices(it);
  $('#qNum').textContent=(state.idx+1)+' / '+state.queue.length;
  $('#qScore').textContent='정답 '+state.score;
  $('#bar').style.width=(state.idx/state.queue.length*100)+'%';
  $('#qMeta').textContent=CATS[it.cat]+' · '+WHO[it.who];
  $('#qEn').textContent=it.en;
  const box=$('#opts');
  box.innerHTML='';
  state.choices.forEach((ko,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='opt'; b.dataset.i=i;
    const n=document.createElement('span'); n.className='num'; n.textContent=i+1;
    const t=document.createElement('span'); t.className='txt'; t.textContent=ko;
    b.appendChild(n); b.appendChild(t);
    b.addEventListener('click',()=>pick(i));
    box.appendChild(b);
  });
  $('#fb').hidden=true;
  const act=$('#act');
  act.textContent='정답 확인';
  act.disabled=true;
  act.hidden=(state.instant==='yes');
}

function pick(i){
  if(state.revealed||i<0||i>=state.choices.length) return;
  state.picked=i;
  document.querySelectorAll('#opts .opt').forEach((b,k)=>b.classList.toggle('sel',k===i));
  $('#act').disabled=false;
  if(state.instant==='yes') reveal();
}

function reveal(){
  if(state.picked===null||state.revealed) return;
  state.revealed=true;
  const it=state.queue[state.idx];
  const right=state.choices.indexOf(it.ko);
  const ok=(state.picked===right);
  if(ok) state.score++;
  state.log.push({it:it,picked:state.choices[state.picked],ok:ok});

  document.querySelectorAll('#opts .opt').forEach((b,k)=>{
    b.disabled=true;
    b.classList.remove('sel');
    if(k===right) b.classList.add('correct');
    else if(k===state.picked) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const fb=$('#fb');
  fb.className='fb '+(ok?'ok':'no');
  $('#fbVerdict').textContent=ok?'정답입니다':'오답입니다';
  $('#fbAnswer').textContent='정답: '+it.ko;
  $('#fbSit').textContent='상황: '+it.sit+' · '+WHO[it.who];
  $('#fbNote').textContent=it.note;
  $('#fbNote').hidden=!it.note;
  fb.hidden=false;

  $('#qScore').textContent='정답 '+state.score;
  $('#bar').style.width=((state.idx+1)/state.queue.length*100)+'%';
  const act=$('#act');
  act.hidden=false; act.disabled=false;
  act.textContent=(state.idx+1>=state.queue.length)?'결과 보기':'다음 문제';
  act.focus();
}

function next(){
  state.idx++;
  if(state.idx>=state.queue.length) showResult(); else showQuestion();
}

function showResult(){
  const n=state.log.length, s=state.score, pct=n?Math.round(s/n*100):0;
  $('#rScore').textContent=s+' / '+n;
  $('#rPct').textContent='정답률 '+pct+'%';
  $('#rMsg').textContent=pct===100?'전부 맞혔어요.':pct>=80?'틀린 문장만 한 번 더 보면 됩니다.':'틀린 문장 위주로 다시 풀어 보세요.';
  const wrong=state.log.filter(l=>!l.ok);
  $('#rWrongWrap').hidden=!wrong.length;
  $('#retryWrong').hidden=!wrong.length;
  const list=$('#rList');
  list.innerHTML='';
  wrong.forEach(l=>{
    const li=document.createElement('li');
    const en=document.createElement('div'); en.className='r-en'; en.lang='en'; en.textContent=l.it.en;
    const ok=document.createElement('div'); ok.className='r-ok'; ok.textContent='정답: '+l.it.ko;
    const no=document.createElement('div'); no.className='r-no'; no.textContent='내가 고른 답: '+l.picked;
    const meta=document.createElement('div'); meta.className='r-meta';
    meta.textContent=CATS[l.it.cat]+' · '+l.it.sit+' · '+WHO[l.it.who]+(l.it.note?' · '+l.it.note:'');
    li.appendChild(en); li.appendChild(ok); li.appendChild(no); li.appendChild(meta);
    list.appendChild(li);
  });
  show('result');
}

function speak(text){
  if(!canSpeak) return;
  const clean=text.replace(/\(이름\)/g,'Alex').replace(/\s*\/\s*/g,', ');
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='en-CA'; u.rate=0.95;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

/* 이벤트 연결 */
document.querySelectorAll('.seg').forEach(seg=>{
  seg.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b) return;
    seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
    state[seg.dataset.key]=b.dataset.val;
    updateInfo();
  });
});
$('#startBtn').addEventListener('click',startNew);
$('#act').addEventListener('click',()=>{ if(state.revealed) next(); else reveal(); });
$('#quitBtn').addEventListener('click',()=>{ if(state.log.length) showResult(); else show('start'); });
$('#retryWrong').addEventListener('click',()=>{ begin(shuffle(state.log.filter(l=>!l.ok).map(l=>l.it))); });
$('#retryNew').addEventListener('click',startNew);
$('#goHome').addEventListener('click',()=>show('start'));
$('#sayBtn').addEventListener('click',()=>{ const it=state.queue[state.idx]; if(it) speak(it.en); });
$('#sayBtn').hidden=!canSpeak;

document.addEventListener('keydown',e=>{
  if($('#quiz').hidden||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key>='1'&&e.key<='5'){ pick(parseInt(e.key,10)-1); return; }
  if(e.key==='Enter'){
    const a=document.activeElement;
    const act=$('#act');
    if(a&&a.tagName==='BUTTON'&&a!==act){
      const isOpt=a.classList.contains('opt');
      if(!isOpt) return;                                   /* 발음 듣기·그만하기 버튼은 그대로 동작 */
      if(!state.revealed&&state.picked!==Number(a.dataset.i)) return; /* 아직 안 고른 보기면 그 보기를 선택 */
    }
    if(a===act) return;                                    /* 버튼 자체의 클릭으로 처리 */
    e.preventDefault();
    if(!act.hidden&&!act.disabled) act.click();
  }
});

$('#total').textContent=ITEMS.length;
updateInfo();
})();
</script>
</body>
</html>
